version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: restaurant_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant_user
      MYSQL_PASSWORD: restaurant_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-user-service:
    build:
      context: ./backend
      dockerfile: auth-user-service/Dockerfile
    container_name: auth_user_service
    restart: always
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: restaurant_user
      DB_PASSWORD: restaurant_password
      JWT_SECRET: DoAnJ2EE_SuperSecretKey_For_Jwt_Authentication_2026_Minimum32Bytes
    depends_on:
      mysql:
        condition: service_healthy

  catalog-table-service:
    build:
      context: ./backend
      dockerfile: catalog-table-service/Dockerfile
    container_name: catalog_table_service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: restaurant_user
      DB_PASSWORD: restaurant_password
      JWT_SECRET: DoAnJ2EE_SuperSecretKey_For_Jwt_Authentication_2026_Minimum32Bytes
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy

  booking-order-service:
    build:
      context: ./backend
      dockerfile: booking-order-service/Dockerfile
    container_name: booking_order_service
    restart: always
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: restaurant_user
      DB_PASSWORD: restaurant_password
      JWT_SECRET: DoAnJ2EE_SuperSecretKey_For_Jwt_Authentication_2026_Minimum32Bytes
      CATALOG_SERVICE_URL: http://catalog-table-service:8082
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-DEMOV210}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-RAOEXHYVSDDIIENYWSLDIIZTANXUXZFJ}
      VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNPAY_RETURN_URL: http://localhost:5173/payment/vnpay-return
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - auth-user-service
      - catalog-table-service
      - booking-order-service

volumes:
  mysql_data:
