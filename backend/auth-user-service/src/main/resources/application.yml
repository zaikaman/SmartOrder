server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-user-service

  datasource:
    url: ${DB_URL:jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:DoAnJ2EE_SuperSecretKey_For_Jwt_Authentication_2026_Minimum32Bytes}
  expiration-ms: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.restaurant.auth: INFO
